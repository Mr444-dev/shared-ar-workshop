name: Server source check

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-check.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix server run check
